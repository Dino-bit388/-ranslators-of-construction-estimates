{% extends "base.html" %}

{% block content %}
<h2><i class="fas fa-upload"></i> Загрузка сметы</h2>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Excel-файл со сметой</label>
                        <input type="file" class="form-control" id="file" name="file" accept=".xlsx" required>
                        <div class="form-text">Поддерживаются файлы в формате XLSX</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="object_name" class="form-label">Наименование объекта</label>
                        <input type="text" class="form-control" id="object_name" name="object_name">
                    </div>
                    
                    <div class="mb-3">
                        <label for="object_type_id" class="form-label">Тип объекта</label>
                        <select class="form-select" id="object_type_id" name="object_type_id" required>
                            <option value="">Выберите тип...</option>
                            {% for ot in object_types %}
                            <option value="{{ ot.id }}">{{ ot.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="work_type_id" class="form-label">Тип работ</label>
                        <select class="form-select" id="work_type_id" name="work_type_id" required>
                            <option value="">Выберите тип...</option>
                            {% for wt in work_types %}
                            <option value="{{ wt.id }}">{{ wt.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="area" class="form-label">Площадь объекта (м²)</label>
                            <input type="number" step="0.01" class="form-control" id="area" name="area" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="year" class="form-label">Год строительства</label>
                            <input type="number" class="form-control" id="year" name="year" value="2026">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="source_name" class="form-label">Источник данных</label>
                        <input type="text" class="form-control" id="source_name" name="source_name" placeholder="Например: Архив Минстроя">
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-cloud-upload-alt"></i> Загрузить и обработать
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
